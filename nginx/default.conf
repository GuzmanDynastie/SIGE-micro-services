user nginx;
worker_processes auto;

error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    multi_accept on;
    use epoll;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;

    # Timeouts
    client_body_timeout 12;
    client_header_timeout 12;
    send_timeout 10;

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Upstreams
    upstream user_service_backend {
        least_conn;
        server user_service_1:5000 max_fails=3 fail_timeout=30s;
        server user_service_2:5000 max_fails=3 fail_timeout=30s;
        server user_service_3:5000 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    upstream ticket_service_backend {
        least_conn;
        server ticket_service_1:5100 max_fails=3 fail_timeout=30s;
        server ticket_service_2:5100 max_fails=3 fail_timeout=30s;
        server ticket_service_3:5100 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    upstream area_service_backend {
        least_conn;
        server area_service_1:5200 max_fails=3 fail_timeout=30s;
        server area_service_2:5200 max_fails=3 fail_timeout=30s;
        server area_service_3:5200 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    upstream loan_service_backend {
        least_conn;
        server loan_service_1:5300 max_fails=3 fail_timeout=30s;
        server loan_service_2:5300 max_fails=3 fail_timeout=30s;
        server loan_service_3:5300 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    upstream subnets_service_backend {
        least_conn;
        server subnets_service_1:5400 max_fails=3 fail_timeout=30s;
        server subnets_service_2:5400 max_fails=3 fail_timeout=30s;
        server subnets_service_3:5400 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    upstream real_state_service_backend {
        least_conn;
        server real_state_service_1:5500 max_fails=3 fail_timeout=30s;
        server real_state_service_2:5500 max_fails=3 fail_timeout=30s;
        server real_state_service_3:5500 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    upstream notifications_service_backend {
        least_conn;
        server notifications_service_1:5601 max_fails=3 fail_timeout=30s;
        server notifications_service_2:5601 max_fails=3 fail_timeout=30s;
        server notifications_service_3:5601 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    server {
        listen 80;
        server_name tu-dominio.com; # Cambiar por tu dominio o IP

        # Security Headers
        add_header X-Content-Type-Options "nosniff";
        add_header X-Frame-Options "SAMEORIGIN";
        add_header X-XSS-Protection "1; mode=block";
        add_header Referrer-Policy "strict-origin-when-cross-origin";
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:;";

        # Proxy settings
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_buffering off;

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # User Service
        location /user/ {
            proxy_pass http://user_service_backend/;
            rewrite ^/user(/.*)$ $1 break;
        }

        # Ticket Service
        location /ticket/ {
            proxy_pass http://ticket_service_backend/;
            rewrite ^/ticket(/.*)$ $1 break;
        }

        # Area Service
        location /area/ {
            proxy_pass http://area_service_backend/;
            rewrite ^/area(/.*)$ $1 break;
        }

        # Loan Service
        location /loan/ {
            proxy_pass http://loan_service_backend/;
            rewrite ^/loan(/.*)$ $1 break;
        }

        # Subnets Service
        location /subnets/ {
            proxy_pass http://subnets_service_backend/;
            rewrite ^/subnets(/.*)$ $1 break;
        }

        # Real State Service
        location /real_state/ {
            proxy_pass http://real_state_service_backend/;
            rewrite ^/real_state(/.*)$ $1 break;
        }

        # Notifications Service
        location /notifications/ {
            proxy_pass http://notifications_service_backend/;
            rewrite ^/notifications(/.*)$ $1 break;
        }

        # Health check endpoint
        location /health {
            add_header Content-Type text/plain;
            return 200 'OK';
        }

        # Block direct access to service ports
        location ~ ^/(5000|5100|5200|5300|5400|5500|5601)/ {
            return 403;
        }

        # Error pages
        error_page 404 /404.html;
        location = /404.html {
            root /usr/share/nginx/html;
            internal;
        }

        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            root /usr/share/nginx/html;
            internal;
        }
    }

    # HTTPS Server (uncomment when you have SSL certificates)
    # server {
    #     listen 443 ssl http2;
    #     server_name tu-dominio.com;
    #
    #     ssl_certificate /etc/nginx/certs/fullchain.pem;
    #     ssl_certificate_key /etc/nginx/certs/privkey.pem;
    #     ssl_trusted_certificate /etc/nginx/certs/chain.pem;
    #
    #     ssl_protocols TLSv1.2 TLSv1.3;
    #     ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
    #     ssl_prefer_server_ciphers on;
    #     ssl_session_cache shared:SSL:10m;
    #     ssl_session_timeout 10m;
    #     ssl_session_tickets off;
    #     ssl_stapling on;
    #     ssl_stapling_verify on;
    #
    #     # HSTS (uncomment after testing)
    #     # add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload";
    #
    #     # Include all locations from HTTP server
    #     include /etc/nginx/conf.d/locations.conf;
